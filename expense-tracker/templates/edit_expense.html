{% extends "base.html" %}

{% block title %}Edit Expense — Spendly{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-container" style="max-width: 520px;">

        <div class="auth-header">
            <h1 class="auth-title">Edit Expense</h1>
            <p class="auth-subtitle">Update transaction details</p>
        </div>

        <div class="auth-card">
            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('edit_expense', id=expense.id) }}">
                <div class="form-group">
                    <label for="amount">Amount (₹)</label>
                    <input type="number" id="amount" name="amount"
                           class="form-input" placeholder="0.00"
                           step="0.01" min="0.01"
                           value="{% if form_data %}{{ form_data.amount }}{% else %}{{ expense.amount }}{% endif %}"
                           required autofocus>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" class="form-input" required>
                        <option value="" disabled>Select category</option>
                        {% for cat in categories %}
                        <option value="{{ cat }}" {% if form_data %}{% if form_data.category == cat %}selected{% endif %}{% else %}{% if expense.category == cat %}selected{% endif %}{% endif %}>{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date"
                           class="form-input"
                           value="{% if form_data %}{{ form_data.date }}{% else %}{{ expense.date }}{% endif %}"
                           required>
                </div>

                <div class="form-group">
                    <label for="description">Description (optional)</label>
                    <input type="text" id="description" name="description"
                           class="form-input" placeholder="e.g. Lunch at Deli"
                           maxlength="200"
                           value="{% if form_data %}{{ form_data.description }}{% else %}{% if expense.description is not none %}{{ expense.description }}{% endif %}{% endif %}">
                </div>

                <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                    <button type="submit" class="btn-submit" style="flex: 1;">Save Changes</button>
                    <a href="{{ url_for('profile') }}" class="preset-btn" style="display: flex; align-items: center; justify-content: center; text-decoration: none; padding: 0.75rem 1.25rem;">Cancel</a>
                </div>
            </form>
        </div>

    </div>
</section>

{% endblock %}
